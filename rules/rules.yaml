previous_cash_not_stored:
  document: "Правила, утверждённые постановлением Правления НБРК от 29.11.2019 № 231"
  clause: "п. 20, абзац 2"
  summary: "Ранее принятые наличные деньги должны храниться в предназначенных для них устройствах, закрывающихся на ключ. Нужно установить, что деньги относятся к завершённому приёму, а не к текущему клиенту."

cash_count_without_client:
  document: "Правила, утверждённые постановлением Правления НБРК от 29.11.2019 № 231"
  clause: "п. 20, абзац 1"
  summary: "Приём и пересчёт наличных денег клиента производится в его присутствии. Применяется к приёму от клиента, а не к любому внутреннему пересчёту."

cashier_left_during_service:
  document: "Правила, утверждённые постановлением Правления НБРК от 29.11.2019 № 231"
  clause: "п. 22"
